<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Character details</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Karla:wght@700&family=Roboto:wght@400;500;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <header class="header__goback">
        <a href="index.html" class="header__link">
            <h3 class="header__link__text">Go back</h3>
        </a>
    </header>
    <main>
        <section class="character">
            <img class="character__image" src="images/rick.jpg" alt="Character image">
            <p class="character__name">Rick Sanchez</p>
        </section>
        <section class="information">
            <h6 class="information__title">Informations</h6>
            <ul class="information__list">
                <li class="information__item">
                    <p class="information__item__title">Gender</p>
                    <p class="information__item__value">Male</p>
                    <div class="information__item__divider"></div>
                </li>
                <li class="information__item">
                    <p class="information__item__title">Status</p>
                    <p class="information__item__value">Alive</p>
                    <div class="information__item__divider"></div>
                </li>
                <li class="information__item">
                    <p class="information__item__title">Specie</p>
                    <p class="information__item__value">Human</p>
                    <div class="information__item__divider"></div>
                </li>
                <li class="information__item">
                    <p class="information__item__title">Origin</p>
                    <p class="information__item__value">Earth (C-137)</p>
                    <div class="information__item__divider"></div>
                </li>
                <li class="information__item">
                    <p class="information__item__title">Type</p>
                    <p class="information__item__value">Unknown</p>
                    <div class="information__item__divider"></div>
                </li>
            </ul>


        </section>
    </main>

</body>

</html>
